<!-- Topbar. Kept on a light surface rather than a saturated brand bar: in a
     dense admin tool the blue is more useful reserved for primary actions and
     the active nav item than spent on 64px of chrome. -->
<mat-toolbar class="topbar">
  @if (isHandset()) {
    <button
      mat-icon-button
      class="topbar__menu"
      (click)="drawer.toggle()"
      aria-label="Toggle navigation menu"
      matTooltip="Menu"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }

  <a class="brand" routerLink="/" aria-label="AssetFlow home">
    <img src="/AssetFlowLogo.png" alt="" class="brand__logo" />
    <span class="brand__name">AssetFlow</span>
  </a>

  <span class="topbar__spacer"></span>

  @if (role(); as currentRole) {
    <!-- The only place the signed-in role is surfaced. Without it there's no
         way to tell an Admin session from an Employee one, which matters when
         admin-only actions simply don't render. -->
    <span class="role-chip" [class.role-chip--admin]="isAdmin()">{{ currentRole }}</span>
  }

  <!-- Sits after a divider: logout is destructive-adjacent and shouldn't read
       as just another toolbar action. -->
  <span class="topbar__divider" aria-hidden="true"></span>

  <button mat-button class="topbar__logout" (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span class="topbar__logout-label">Logout</span>
  </button>
</mat-toolbar>

<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="false"
  >
    <nav class="nav" aria-label="Main">
      <mat-nav-list class="nav__list">
        <a
          mat-list-item
          routerLink="/assets"
          routerLinkActive="nav__item--active"
          #assetsLink="routerLinkActive"
          [attr.aria-current]="assetsLink.isActive ? 'page' : null"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>inventory_2</mat-icon>
          <span matListItemTitle>Assets</span>
        </a>

        @if (isAdmin()) {
          <a
            mat-list-item
            routerLink="/users/pending"
            routerLinkActive="nav__item--active"
            #requestsLink="routerLinkActive"
            [attr.aria-current]="requestsLink.isActive ? 'page' : null"
            (click)="isHandset() && drawer.close()"
          >
            <mat-icon matListItemIcon>how_to_reg</mat-icon>
            <span matListItemTitle>Requests</span>
          </a>

          <a
            mat-list-item
            routerLink="/employees"
            routerLinkActive="nav__item--active"
            #employeesLink="routerLinkActive"
            [attr.aria-current]="employeesLink.isActive ? 'page' : null"
            (click)="isHandset() && drawer.close()"
          >
            <mat-icon matListItemIcon>groups</mat-icon>
            <span matListItemTitle>Employees</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
